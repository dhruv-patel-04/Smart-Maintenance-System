<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Maintenance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f4f7fb;
            --bg-2: #e8eef7;
            --ink-1: #10233d;
            --ink-2: #425466;
            --line: #d8e2ee;
            --surface: #ffffff;
            --accent: #0f8a83;
            --accent-dark: #0b6661;
            --ok: #1f8f4e;
            --warn: #c08112;
            --risk: #bf3d3d;
        }

        body {
            font-family: "Manrope", sans-serif;
            color: var(--ink-1);
            background:
                radial-gradient(1200px 600px at 10% -20%, #dbe7f8 0%, transparent 60%),
                radial-gradient(1000px 600px at 90% -30%, #d8f0ec 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
        }

        .topbar {
            background: rgba(16, 35, 61, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
            margin-left: 0.75rem;
            border-bottom: 2px solid transparent;
            padding-bottom: 0.35rem;
            transition: all 0.2s ease;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #ffffff;
            border-bottom-color: #7fd9d3;
        }

        .user-actions {
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            margin-left: 1.5rem;
            padding-left: 1.5rem;
        }

        .logout-btn {
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
        }

        .page-shell {
            margin-top: 2rem;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(16, 35, 61, 0.06);
        }

        .panel-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--line);
            font-weight: 700;
            color: var(--ink-1);
            background: rgba(244, 247, 251, 0.6);
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
        }

        .panel-body {
            padding: 1.25rem;
        }

        .card-title-small {
            font-size: 0.88rem;
            color: var(--ink-2);
            margin-bottom: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .metric {
            font-size: 2rem;
            font-weight: 800;
            color: var(--ink-1);
            line-height: 1.1;
        }

        .metric-card {
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #fff;
            box-shadow: 0 8px 24px rgba(16, 35, 61, 0.05);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            border: 1px solid transparent;
        }

        .status-normal {
            color: var(--ok);
            background: rgba(31, 143, 78, 0.1);
            border-color: rgba(31, 143, 78, 0.2);
        }

        .status-warning {
            color: #7e560b;
            background: rgba(192, 129, 18, 0.14);
            border-color: rgba(192, 129, 18, 0.25);
        }

        .status-failure {
            color: var(--risk);
            background: rgba(191, 61, 61, 0.12);
            border-color: rgba(191, 61, 61, 0.24);
        }

        .table-wrap {
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        .table {
            margin-bottom: 0;
        }

        .table td,
        .table th {
            vertical-align: middle;
            border-color: #e6edf5;
            font-size: 0.92rem;
        }

        .table thead th {
            background: #f6f9fc;
            color: #33485f;
            font-weight: 700;
            white-space: nowrap;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.9rem 1.25rem;
        }

        .meta-label {
            color: var(--ink-2);
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 0.18rem;
        }

        .meta-value {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--ink-1);
        }

        .trend-wrap {
            position: relative;
            min-height: 310px;
        }

        .soft-link {
            color: var(--accent-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .soft-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        @media (max-width: 991.98px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }

            .page-shell {
                margin-top: 1.3rem;
            }
        }
    </style>

    {% block styles %}{% endblock %}

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark topbar">
        <div class="container">

            <a class="navbar-brand" href="/">
                Smart Maintenance System
            </a>

            <div class="d-flex align-items-center">

                <div class="navbar-nav">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        Dashboard
                    </a>

                    <a class="nav-link {% if request.path.startswith('/charts') %}active{% endif %}" href="/charts">
                        Charts
                    </a>

                    <a class="nav-link {% if request.path.startswith('/history') %}active{% endif %}" href="/history">
                        History
                    </a>

                    <a class="nav-link {% if request.path.startswith('/reports') %}active{% endif %}" href="/reports">
                        Reports
                    </a>

                    <a class="nav-link {% if request.path.startswith('/settings') %}active{% endif %}" href="/settings">
                        Settings
                    </a>
                </div>

                {% if session.get('user') %}
                <div class="d-flex align-items-center user-actions">

                    <span class="text-white-50 small me-3">
                        {{ session['user']['email'] }}
                    </span>

                    <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm logout-btn">
                        Logout
                    </a>

                </div>
                {% endif %}

            </div>

        </div>
    </nav>

    <div class="container page-shell mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
